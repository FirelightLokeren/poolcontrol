esphome:
  name: "poolcontrol"
  friendly_name: "poolcontrol"

substitutions:
  name: "poolcontrol"
  friendly_name: "poolcontrol"
  debounce_time: "100ms"

esp32:
  board: esp32dev
  framework:
    type: arduino

packages:
  core: !include poolcontrol_files/core.yaml
  heatpump: !include poolcontrol_files/heatpump.yaml
  dingtian: !include poolcontrol_files/dingtian.yaml
  display: !include poolcontrol_files/display.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Dingtian Fallback Hotspot"
    password: !secret ap_password

captive_portal:

logger:
  level: DEBUG
  baud_rate: 0
  on_message:
    level: ERROR
    then:
      - if:
          condition:
            lambda: |-
              return tag != nullptr && strcmp(tag, "ezo-pmp") == 0;
          then:
            - globals.set:
                id: last_error_ms
                value: !lambda return millis();
            - globals.set:
                id: pomp_bereikbaar_flag
                value: "false"

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: "2494bd7a1d2db33431a15e569937e31d"

web_server:
  port: 80
  version: 3
  js_url: https://oi.esphome.io/v3/www.js

time:
  - platform: sntp
    id: my_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - globals.set:
              id: dag_volume_gedoseerd
              value: "0.0"
          - logger.log: "Dagvolume teller gereset om middernacht"

i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a
  frequency: 400kHz

one_wire:
  - platform: gpio
    id: sensor_bus
    pin: 0

uart:
  id: mod_bus
  tx_pin: 1
  rx_pin: 3
  baud_rate: 9600
  stop_bits: 1

# ─── EZO-PMP (chloor, adres 0x64) ───────────────────────────────────────────

ezo_pmp:
  id: chloor
  i2c_id: bus_a
  address: 100        # 0x64
  update_interval: 10s

# ─── Globals ─────────────────────────────────────────────────────────────────

globals:
  # Pomp controle
  - id: last_pump_speed
    type: std::string
    initial_value: '""'

  - id: heatpump_on_since
    type: uint32_t
    initial_value: '0'

  - id: heatpump_auto_on
    type: bool
    initial_value: 'false'

  - id: flow_retry_count
    type: int
    restore_value: false
    initial_value: '0'

  - id: flow_emergency
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: flow_retry_speed
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: flow_retry_pending
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: flow_retry_at
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: vacuum_start_time
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Flow trend detectie (gebruikt door dingtian.yaml)
  - id: flow_reference
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: flow_low_since
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Waterstand hoog notificatie (gebruikt door dingtian.yaml)
  - id: water_level_high_notified
    type: bool
    restore_value: false
    initial_value: 'false'

  # Chloor pomp
  - id: auto_dosing_enabled
    type: bool
    restore_value: true
    initial_value: "true"

  - id: last_dose_time
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: dag_volume_gedoseerd
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: pomp_bereikbaar_flag
    type: bool
    restore_value: false
    initial_value: "false"

  - id: last_error_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: prev_current_volume
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: totaal_volume_persistent
    type: float
    restore_value: true
    initial_value: "0.0"

# ─── Binary sensoren ─────────────────────────────────────────────────────────

binary_sensor:
  - platform: template
    id: startup_complete
    internal: true

  - platform: ezo_pmp
    pump_state:
      name: "Chloor Pomp Actief"
      icon: mdi:pump
    is_paused:
      name: "Chloor Pomp Gepauzeerd"
      icon: mdi:pause-circle

  - platform: template
    id: pomp_bereikbaar
    name: "Chloor Pomp Bereikbaar"
    device_class: connectivity
    icon: mdi:lan-connect
    lambda: |-
      return id(pomp_bereikbaar_flag);
    on_state:
      then:
        - if:
            condition:
              lambda: 'return !x;'
            then:
              - logger.log: "WAARSCHUWING: Chloor pomp niet bereikbaar (I2C read error)"

# ─── Select ──────────────────────────────────────────────────────────────────

select:
  - platform: template
    name: "Pump Mode"
    id: pump_mode
    optimistic: true
    options:
      - "auto"
      - "manual"
      - "vacuum"
    initial_option: "auto"
    restore_value: true
    on_value:
      then:
        - lambda: |-
            if (x == "vacuum") {
              ESP_LOGI("vacuum", "Vacuum modus gestart → pomp high + klep Pool");
              id(relay_pump_high).turn_on();
              id(pump_speed).publish_state("high");
              id(relay_bypass).turn_off();
              id(vacuum_start_time) = millis() / 1000;
            }

# ─── Switch ──────────────────────────────────────────────────────────────────

switch:
  - platform: template
    name: "Forced heating"
    id: sw_forced_heating
    optimistic: True

  - platform: template
    id: auto_dosing_switch
    name: "Automatisch Doseren"
    icon: mdi:robot
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(auto_dosing_enabled);
    turn_on_action:
      - globals.set:
          id: auto_dosing_enabled
          value: "true"
      - logger.log: "Automatisch doseren INGESCHAKELD"
    turn_off_action:
      - globals.set:
          id: auto_dosing_enabled
          value: "false"
      - ezo_pmp.stop_dosing:
          id: chloor
      - logger.log: "Automatisch doseren UITGESCHAKELD — pomp gestopt"

# ─── Number ──────────────────────────────────────────────────────────────────

number:
  - platform: template
    id: manueel_volume
    name: "Chloor Manueel Volume"
    optimistic: true
    restore_value: true
    initial_value: 50
    min_value: 1
    max_value: 500
    step: 0.5
    unit_of_measurement: "mL"
    icon: mdi:beaker
    mode: box

  - platform: template
    id: calib_volume
    name: "Chloor Kalibratie Volume (gemeten)"
    optimistic: true
    restore_value: false
    initial_value: 10
    min_value: 1
    max_value: 100
    step: 0.1
    unit_of_measurement: "mL"
    icon: mdi:flask
    mode: box

  - platform: template
    id: orp_drempel_laag
    name: "ORP Drempel (doseer onder)"
    optimistic: true
    restore_value: true
    initial_value: 650
    min_value: 400
    max_value: 800
    step: 10
    unit_of_measurement: "mV"
    icon: mdi:arrow-down-bold
    mode: box

  - platform: template
    id: orp_drempel_hoog
    name: "ORP Drempel (stop boven)"
    optimistic: true
    restore_value: true
    initial_value: 750
    min_value: 500
    max_value: 900
    step: 10
    unit_of_measurement: "mV"
    icon: mdi:arrow-up-bold
    mode: box

  - platform: template
    id: auto_dose_volume
    name: "Chloor Auto Dosis Volume"
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 1
    max_value: 200
    step: 0.5
    unit_of_measurement: "mL"
    icon: mdi:beaker-outline
    mode: box

  - platform: template
    id: min_wachttijd
    name: "Chloor Min. Wachttijd Tussen Doses"
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 5
    max_value: 240
    step: 5
    unit_of_measurement: "min"
    icon: mdi:timer-outline
    mode: box

  - platform: template
    id: max_dag_volume
    name: "Chloor Max Volume Per Dag"
    optimistic: true
    restore_value: true
    initial_value: 500
    min_value: 50
    max_value: 2000
    step: 10
    unit_of_measurement: "mL"
    icon: mdi:calendar-alert
    mode: box

# ─── Knoppen ─────────────────────────────────────────────────────────────────

button:
  # pH kalibratie
  - platform: template
    name: "Clear pH Calibration"
    id: ph_calibrate_clear
    on_press:
      then:
        - lambda: id(ph_ezo).clear_calibration();

  - platform: template
    name: "pH 7 Calibrate"
    id: ph_calibrate_7
    on_press:
      then:
        - lambda: id(ph_ezo).set_calibration_point_mid(7.00);

  - platform: template
    name: "pH 10 Calibrate"
    id: ph_calibrate_10
    on_press:
      then:
        - lambda: id(ph_ezo).set_calibration_point_high(10.00);

  - platform: template
    name: "pH 4 Calibrate"
    id: ph_calibrate_4
    on_press:
      then:
        - lambda: id(ph_ezo).set_calibration_point_low(4.00);

  - platform: template
    name: "Query pH slope"
    id: ph_query_slope
    on_press:
      then:
        - lambda: id(ph_ezo).send_custom("SLOPE,?");

  # ORP kalibratie
  - platform: template
    name: "Clear Orp Calibration"
    id: orp_calibrate_clear
    on_press:
      then:
        - lambda: id(orp_ezo).clear_calibration();

  - platform: template
    name: "Orp 225mV Calibrate"
    id: orp_calibrate_225mV
    on_press:
      then:
        - lambda: id(orp_ezo).send_custom("Cal,225");

  # Chloor pomp
  - platform: template
    name: "Chloor Doseer Manueel"
    icon: mdi:water-plus
    on_press:
      - logger.log:
          format: "Manuele chloor dosis: %.1f mL"
          args: ["id(manueel_volume).state"]
      - ezo_pmp.dose_volume:
          id: chloor
          volume: !lambda return id(manueel_volume).state;

  - platform: template
    name: "Chloor Stop Pomp"
    icon: mdi:stop-circle
    on_press:
      - ezo_pmp.stop_dosing:
          id: chloor
      - logger.log: "Chloor pomp handmatig gestopt"

  - platform: template
    name: "Chloor Reset Totaal Volume"
    icon: mdi:refresh
    on_press:
      - ezo_pmp.clear_total_volume_dosed:
          id: chloor
      - logger.log: "Chloor totaal gedoseerd volume gereset"

  - platform: template
    name: "Chloor Reset Totaal Volume (persistent)"
    icon: mdi:database-remove
    on_press:
      - globals.set:
          id: totaal_volume_persistent
          value: "0.0"
      - logger.log: "Chloor persistente totaalteller gereset"

  - platform: template
    name: "Chloor Reset Dagvolume"
    icon: mdi:calendar-refresh
    on_press:
      - globals.set:
          id: dag_volume_gedoseerd
          value: "0.0"
      - logger.log: "Chloor dagvolume teller manueel gereset"

  - platform: template
    name: "Chloor Stel Kalibratie In"
    icon: mdi:check-bold
    on_press:
      - logger.log:
          format: "Chloor kalibratie instellen op %.1f mL"
          args: ["id(calib_volume).state"]
      - ezo_pmp.set_calibration_volume:
          id: chloor
          volume: !lambda return id(calib_volume).state;

  - platform: template
    name: "Chloor Wis Kalibratie"
    icon: mdi:delete-forever
    on_press:
      - ezo_pmp.clear_calibration:
          id: chloor
      - logger.log: "Chloor kalibratie gewist"

# ─── Sensoren ────────────────────────────────────────────────────────────────

sensor:
  - platform: ezo
    id: ph_ezo
    name: "pH"
    address: 99
    accuracy_decimals: 2
    unit_of_measurement: "pH"
    state_class: "measurement"
    update_interval: 15s
    internal: false
    on_value:
      - lambda: id(pool_display_panel).set_ph(x);
    on_custom:
      then:
        - lambda: |-
            ESP_LOGI("ph_slope", "EZO response: %s", x.c_str());

  - platform: ezo
    id: orp_ezo
    name: "ORP"
    address: 98
    accuracy_decimals: 1
    unit_of_measurement: "mV"
    state_class: "measurement"
    update_interval: 15s
    internal: false
    on_value:
      - lambda: id(pool_display_panel).set_orp(x);
      - script.execute: check_auto_dosing

  - platform: ezo
    id: rtd_ezo_roof
    name: "Roof temp"
    icon: "mdi:sun-thermometer-outline"
    address: 102
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    state_class: "measurement"
    update_interval: 15s
    internal: false
    web_server:
      sorting_weight: 20

  - platform: ezo
    id: rtd_ezo_pool
    name: "pool temp"
    icon: "mdi:pool-thermometer"
    address: 103
    accuracy_decimals: 1
    unit_of_measurement: "°C"
    state_class: "measurement"
    update_interval: 15s
    internal: false
    on_value:
      - lambda: id(pool_display_panel).set_temperature(x);
    web_server:
      sorting_weight: 30

  - platform: ezo
    id: flow_ezo
    name: "Pump Flow Total"
    address: 104
    accuracy_decimals: 1
    unit_of_measurement: "L"
    state_class: total_increasing
    internal: true
    web_server:
      sorting_weight: 75
    update_interval: 15s

  - platform: template
    name: "Pump Flow Rate"
    id: flow_rate
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      static float last_value = 0;
      static uint32_t last_update = 0;
      float current = id(flow_ezo).state;
      uint32_t now = millis();
      if (last_update == 0) {
        last_update = now;
        last_value = current;
        return NAN;
      }
      float delta = current - last_value;
      float time_diff = (now - last_update) / 15000.0;
      last_value = current;
      last_update = now;
      if (time_diff <= 0 || delta < 0) return NAN;
      return delta / time_diff;
    web_server:
      sorting_weight: 74

  - platform: dallas_temp
    address: 0x86011564a252ff28
    name: "Omgeving"
    id: ble_pool_temp_template
    update_interval: 15s
    internal: false
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: mdi:home-thermometer
    web_server:
      sorting_weight: 10

  - platform: template
    id: delta_temp
    name: "Delta temperature"
    unit_of_measurement: "°C"
    update_interval: 10s
    icon: mdi:delta
    lambda: 'return id(rtd_ezo_roof).state - id(rtd_ezo_pool).state;'
    internal: false
    web_server:
      sorting_weight: 40

  - platform: template
    name: "Vrije Chloor (met temp)"
    id: vrije_chloor_temp
    unit_of_measurement: "ppm"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (isnan(id(ph_ezo).state) || isnan(id(orp_ezo).state) || isnan(id(rtd_ezo_pool).state)) {
        return NAN;
      }
      float orp = id(orp_ezo).state;
      float ph = id(ph_ezo).state;
      float temp = id(rtd_ezo_pool).state;
      const float E0 = 770.0;
      const float alpha = -1.0;
      float temp_correction = alpha * (temp - 25.0);
      float exponent = (orp - E0 + temp_correction + 60.0 * (7.0 - ph)) / 59.0;
      return pow(10.0, exponent);

  # Chloor pomp sensoren
  - platform: ezo_pmp
    current_volume_dosed:
      name: "Chloor Volume Gedoseerd (huidig)"
      unit_of_measurement: "mL"
      accuracy_decimals: 1
      icon: mdi:water-percent
      on_value:
        then:
          - lambda: |-
              float delta = x - id(prev_current_volume);
              if (delta > 0) {
                id(totaal_volume_persistent) += delta;
              } else if (delta < 0) {
                id(totaal_volume_persistent) += x;
              }
              id(prev_current_volume) = x;
    total_volume_dosed:
      name: "Chloor Totaal Volume Gedoseerd"
      unit_of_measurement: "mL"
      accuracy_decimals: 1
      icon: mdi:chart-bar
    max_flow_rate:
      name: "Chloor Max Flowrate"
      unit_of_measurement: "mL/min"
      accuracy_decimals: 1
      icon: mdi:speedometer

  - platform: template
    id: dag_volume_sensor
    name: "Chloor Gedoseerd Vandaag"
    unit_of_measurement: "mL"
    accuracy_decimals: 1
    icon: mdi:calendar-today
    update_interval: 10s
    lambda: |-
      return id(dag_volume_gedoseerd);

  - platform: template
    id: totaal_persistent_sensor
    name: "Chloor Totaal Volume Gedoseerd (persistent)"
    unit_of_measurement: "mL"
    accuracy_decimals: 1
    icon: mdi:database-clock
    update_interval: 60s
    lambda: |-
      return id(totaal_volume_persistent);

# ─── Text sensoren ───────────────────────────────────────────────────────────

text_sensor:
  - platform: ezo_pmp
    dosing_mode:
      name: "Chloor Doseer Modus"
      icon: mdi:cog
    calibration_status:
      name: "Chloor Kalibratie Status"
      icon: mdi:check-decagram

# ─── Intervals ───────────────────────────────────────────────────────────────

interval:
  # Chloor pomp bereikbaar: 12s zonder error → bereikbaar
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return (millis() - id(last_error_ms)) >= 12000;
          then:
            - globals.set:
                id: pomp_bereikbaar_flag
                value: "true"

  # Flow bescherming
  - interval: 15s
    then:
      - lambda: |-
          // --- VACUUM MODUS BEWAKING ---
          if (id(pump_mode).current_option() == "vacuum") {
            uint32_t now = millis() / 1000;
            if (id(pump_speed).current_option() != "high") {
              id(relay_pump_high).turn_on();
              id(pump_speed).publish_state("high");
            }
            if (id(relay_bypass).state) {
              id(relay_bypass).turn_off();
            }
            if (id(vacuum_start_time) > 0 &&
                (now - id(vacuum_start_time)) >= 3600) {
              ESP_LOGI("vacuum", "Vacuum modus klaar na 60 min → terug naar auto");
              id(pump_mode).make_call().set_option("auto").perform();
              id(vacuum_start_time) = 0;
            }
            return;
          }

          // --- POMPBEVEILIGING BIJ LAGE FLOW ---
          if (id(pump_mode).current_option() != "auto") return;
          std::string speed = id(pump_speed).current_option();
          if (speed == "off") return;
          if (id(flow_emergency) && speed != "off") {
            ESP_LOGI("flow_protect", "Pomp herstart gedetecteerd → emergency reset");
            id(flow_emergency) = false;
            id(flow_retry_count) = 0;
            id(flow_retry_pending) = false;
          }
          if (id(flow_emergency)) return;
          float flow = id(flow_rate).state;
          if (isnan(flow)) return;
          uint32_t now = millis() / 1000;
          if (id(flow_retry_pending)) {
            if ((now - id(flow_retry_at)) < 60) return;
            id(flow_retry_pending) = false;
          }
          if (flow >= 0.5) {
            if (id(flow_retry_count) > 0) {
              ESP_LOGI("flow_protect", "Flow hersteld (%.2f L/min) - retry teller gereset", flow);
              id(flow_retry_count) = 0;
            }
            return;
          }
          id(flow_retry_count) += 1;
          ESP_LOGW("flow_protect", "Flow te laag! %.2f L/min - retry %d/3",
                   flow, id(flow_retry_count));
          if (id(flow_retry_count) >= 3) {
            ESP_LOGE("flow_protect", "Pump emergency shutdown na 3 retries!");
            id(flow_emergency) = true;
            id(flow_retry_count) = 0;
            id(relay_pump_off).turn_on();
            id(pump_speed).publish_state("off");
            id(notify_msg) = std::string("Pump emergency shutdown! Flow te laag na 3 retries. Manuele herstart vereist.");
            id(notify_fault) = true;
            id(notify_push) = true;
          } else {
            id(flow_retry_speed) = speed;
            ESP_LOGW("flow_protect", "Pomp 30sec UIT voor retry %d", id(flow_retry_count));
            id(relay_pump_off).turn_on();
            id(pump_speed).publish_state("off");
            id(flow_retry_at) = now;
            id(flow_retry_pending) = false;
          }

  - interval: 30s
    then:
      - lambda: |-
          // --- POMP HERSTART NA 30SEC ---
          if (!id(flow_retry_pending) &&
              id(flow_retry_count) > 0 &&
              !id(flow_emergency) &&
              id(pump_mode).current_option() == "auto") {
            std::string speed = id(flow_retry_speed);
            ESP_LOGI("flow_protect", "Pomp herstart na 30sec → snelheid: %s", speed.c_str());
            id(relay_pump_off).turn_off();
            if (speed == "low") {
              id(relay_pump_low).turn_on();
            } else if (speed == "med") {
              id(relay_pump_med).turn_on();
            } else if (speed == "high") {
              id(relay_pump_high).turn_on();
            }
            id(pump_speed).publish_state(speed);
            id(flow_retry_pending) = true;
            id(flow_retry_at) = millis() / 1000;
          }

  - interval: 2s
    then:
      - lambda: |-
          if (!isnan(id(flow_rate).state) && id(flow_rate).state < 2.0) {
            ESP_LOGW("flow_check", "💧 Flow rate is below 2.0 L/min (%.2f)", id(flow_rate).state);
          }

# ─── Scripts ─────────────────────────────────────────────────────────────────

script:
  # Waterstand hoog notificatie (herhaald elke 5 min zolang hoog)
  - id: water_level_high_notify
    mode: restart
    then:
      - homeassistant.service:
          service: persistent_notification.create
          data:
            title: "💧 Waterstand te hoog!"
            message: "Pool waterstand is te hoog. Controleer onmiddellijk."
            notification_id: "pool_water_level_high"
      - globals.set:
          id: water_level_high_notified
          value: "true"
      - delay: 5min
      - if:
          condition:
            lambda: 'return id(input_water_level_high).state;'
          then:
            - script.execute: water_level_high_notify

  # Automatisch doseren op basis van ORP
  - id: check_auto_dosing
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(auto_dosing_enabled);
          then:
            - if:
                condition:
                  lambda: |-
                    uint32_t nu = millis() / 1000;
                    uint32_t wacht_sec = (uint32_t)(id(min_wachttijd).state * 60);
                    bool pomp_ok = id(pomp_bereikbaar).state;
                    bool orp_te_laag = id(orp_ezo).state < id(orp_drempel_laag).state;
                    bool wachttijd_ok = (nu - id(last_dose_time)) >= wacht_sec;
                    bool dag_ok = (id(dag_volume_gedoseerd) + id(auto_dose_volume).state) <= id(max_dag_volume).state;
                    return pomp_ok && orp_te_laag && wachttijd_ok && dag_ok;
                then:
                  - logger.log:
                      format: "ORP %.0f mV < drempel %.0f mV → doseren %.1f mL (vandaag al %.1f / %.1f mL)"
                      args:
                        - "id(orp_ezo).state"
                        - "id(orp_drempel_laag).state"
                        - "id(auto_dose_volume).state"
                        - "id(dag_volume_gedoseerd)"
                        - "id(max_dag_volume).state"
                  - globals.set:
                      id: last_dose_time
                      value: !lambda return millis() / 1000;
                  - globals.set:
                      id: dag_volume_gedoseerd
                      value: !lambda return id(dag_volume_gedoseerd) + id(auto_dose_volume).state;
                  - ezo_pmp.dose_volume:
                      id: chloor
                      volume: !lambda return id(auto_dose_volume).state;
                else:
                  - if:
                      condition:
                        lambda: 'return !id(pomp_bereikbaar).state;'
                      then:
                        - logger.log: "Automatisch doseren overgeslagen: chloor pomp niet bereikbaar"
                  - if:
                      condition:
                        lambda: |-
                          return id(pomp_bereikbaar).state &&
                                 (id(dag_volume_gedoseerd) + id(auto_dose_volume).state) > id(max_dag_volume).state;
                      then:
                        - logger.log:
                            format: "Dagmaximum bereikt: %.1f / %.1f mL — automatisch doseren geblokkeerd"
                            args:
                              - "id(dag_volume_gedoseerd)"
                              - "id(max_dag_volume).state"